<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Flexbox Site</title>
  </head>
  <body>
    <section id="products">
      <div class="container">
        <h3 class="small-heading">Featured products</h3>
        <h2>Popular this week</h2>
      </div>
      <div class="product-row">
        <article class="product-card">
          <img
            src="./images/headphones.png"
            alt="wireless headphones on a yellow background"
            class="product-image headphone-image"
          />

          <div class="product-info">
            <h3>Wireless Headphones</h3>
            <p>Clear sound, comfortable fit and long battery life.</p>
            <div class="product-bottom">
              <p class="price">$129</p>
              <a href="" class="button blue-button">Buy Now</a>
            </div>
          </div>
        </article>
      </div>
    </section>
  </body>
</html>
